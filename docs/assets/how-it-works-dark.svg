<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 300' width='900' height='300' role='img' aria-label='Agents run bay merge and leave; a runner builds the merged candidate, checks that exact commit, and merges it into main if main has not moved, with signed evidence in Git notes.'>
<defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#9198a1'/></marker>
<marker id='g' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#3fb8a9'/></marker></defs>
<rect width='900' height='300' rx='14' fill='#0d1117'/>
<text x='40' y='44' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#9198a1' letter-spacing='1'>AGENTS</text>
<rect x='40' y='62' width='190' height='40' rx='8' fill='#151b23' stroke='#3d444d'/>
<text x='56' y='87' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='13' fill='#e6edf3'>agent-1  CARD-123</text>
<rect x='40' y='114' width='190' height='40' rx='8' fill='#151b23' stroke='#3d444d'/>
<text x='56' y='139' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='13' fill='#e6edf3'>agent-2  CARD-124</text>
<rect x='40' y='166' width='190' height='40' rx='8' fill='#151b23' stroke='#3d444d'/>
<text x='56' y='191' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='13' fill='#e6edf3'>agent-3  CARD-125</text>
<path d='M236 134 H330' stroke='#9198a1' stroke-width='1.6' fill='none' marker-end='url(#a)'/>
<text x='283' y='122' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='13' fill='#e6edf3' text-anchor='middle'>bay merge</text>
<text x='283' y='154' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#9198a1' text-anchor='middle'>returns at once</text>
<text x='340' y='44' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#9198a1' letter-spacing='1'>RUNNER</text>
<rect x='340' y='62' width='290' height='144' rx='10' fill='#0f2a28' stroke='#3fb8a9' stroke-width='1.4'/>
<circle cx='366' cy='91' r='11' fill='#3fb8a9'/>
<text x='366' y='95.5' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' font-weight='700' fill='#0d1117' text-anchor='middle'>1</text>
<text x='388' y='96' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#e6edf3'>build the merged candidate</text>
<circle cx='366' cy='131' r='11' fill='#3fb8a9'/>
<text x='366' y='135.5' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' font-weight='700' fill='#0d1117' text-anchor='middle'>2</text>
<text x='388' y='136' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#e6edf3'>check that exact commit</text>
<circle cx='366' cy='171' r='11' fill='#3fb8a9'/>
<text x='366' y='175.5' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' font-weight='700' fill='#0d1117' text-anchor='middle'>3</text>
<text x='388' y='176' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#e6edf3'>merge it if main has not moved</text>
<path d='M630 176 C 690 176, 690 92, 634 92' stroke='#d29922' stroke-width='1.4' stroke-dasharray='4 4' fill='none' marker-end='url(#a)'/>
<text x='640' y='230' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#d29922'>main moved? build and check again</text>
<path d='M485 206 V244' stroke='#9198a1' stroke-width='1.4' fill='none' marker-end='url(#a)'/>
<text x='485' y='268' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='12.5' fill='#e6edf3' text-anchor='middle'>signed evidence in Git notes</text>
<text x='740' y='44' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#9198a1' letter-spacing='1'>MAIN</text>
<path d='M700 134 H736' stroke='#3fb8a9' stroke-width='1.8' fill='none' marker-end='url(#g)'/>
<line x1='760' y1='70' x2='760' y2='200' stroke='#3d444d' stroke-width='3'/>
<circle cx='760' cy='80' r='6' fill='#151b23' stroke='#9198a1' stroke-width='2'/>
<circle cx='760' cy='107' r='6' fill='#151b23' stroke='#9198a1' stroke-width='2'/>
<circle cx='760' cy='134' r='8' fill='#3fb8a9' stroke='#3fb8a9' stroke-width='2'/>
<text x='778' y='139' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#e6edf3'>what was checked</text>
<text x='778' y='158' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#9198a1'>no more, no less</text>
</svg>
