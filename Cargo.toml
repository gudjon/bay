[package]
name = "bay"
version = "0.6.3"
edition = "2024"
rust-version = "1.99"
description = "The landing layer for agent fleets: agents submit once, bay lands exactly what was checked."
authors = ["Gudjon Mar Gudjonsson"]
license = "MIT"
readme = "README.md"
homepage = "https://getbay.io"
documentation = "https://getbay.io/docs"
repository = "https://github.com/gudjon/bay"
keywords = ["git", "ai-agents", "merge-queue", "monorepo", "cli"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["float_roundtrip", "preserve_order"] }
sha2 = "0.11.1"
toml = "1.1.8"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true

# Tests build with the dev profile. Line tables keep file and line numbers in panics and
# backtraces; the rest of the debug info is not built.
[profile.dev]
debug = "line-tables-only"
